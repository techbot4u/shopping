  <title>쇼핑모음</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    ul { list-style: none; padding: 0; }
    li { margin: 10px 0; }

    /* 링크 스타일 */
    a {
      display: inline-block;
      padding: 12px 20px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      position: relative; /* 툴팁 위치 기준 */
    }
    a:hover {
      background: #0056b3;
    }

    /* 툴팁 기본 숨김 */
    a .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: 125%; /* 링크 위쪽에 표시 */
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      font-size: 0.9rem;
      transition: opacity 0.3s;
    }

    /* 말풍선 꼬리 */
    a .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #333 transparent transparent transparent;
    }

    /* 마우스 올렸을 때 표시 */
    a:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
