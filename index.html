<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑모음</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }

    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    /* li 자체를 position 기준점 + 개별 stacking context 로 사용 */
    li {
      position: relative;
      z-index: 1;
    }
    /* 호버/탭 상태인 항목만 다른 항목들 위로 올라오도록 */
    li:hover,
    li.active {
      z-index: 50;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
    }
    a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    a img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #fff;
    }

    /* 브랜드별 색상 */
    .kurly { background: #6A1B9A; }
    .coupang { background: #FF5A00; }
    .gmarket { background: #008000; }
    .elevenst { background: #FF0000; }
    .ssg { background: #222; }
    .hyundai { background: #0066CC; }
    .gs { background: #00AEEF; }
    .aliexpress { background: #E52D27; }
    .hfashion { background: #333399; }
    .cj { background: #FF6600; }
    .kyobo { background: #2E8B57; }
    .school { background: #444; }
    .default { background: #222; }

    /* 툴팁 */
    .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;

      /* 핵심: 링크 박스보다 좁아서 세로로 길게 늘어지는 문제 방지 */
      width: max-content;
      max-width: min(240px, calc(100vw - 24px));

      font-size: 0.85rem;
      line-height: 1.4;
      white-space: normal;
      pointer-events: none;

      transition: opacity 0.2s ease;
      z-index: 100;
    }
    .tooltip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent #333 transparent;
    }

    /* 데스크톱: 마우스 호버로 표시 */
    a:hover .tooltip,
    a:focus-visible .tooltip {
      visibility: visible;
      opacity: 1;
    }
    /* 모바일: JS가 붙여주는 .show 클래스로 표시 (탭 지원) */
    .tooltip.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <h2>내 쇼핑 사이트</h2>
  <ul>
    <li><a href="http://deg.kr/shopbox/a7db91" target="_blank" class="default">오늘의 추천상품</a></li>
    <li><a href="https://bitl.bz/S0YWE2" target="_blank" class="kurly">컬리</a></li>
    <li><a href="https://bitl.bz/P1aoKl" target="_blank" class="hyundai">현대홈쇼핑</a></li>
    <li><a href="https://bitl.bz/kznqBE" target="_blank" class="gs">GS홈쇼핑</a></li>
    <li><a href="https://bitl.bz/3laSX4" target="_blank" class="aliexpress">알리익스프레스</a></li>
    <li><a href="https://bitl.bz/VnIypD" target="_blank" class="coupang">쿠팡
      <span class="tooltip">링크를 통해 구매 시 수수료를 제공받습니다</span>
    </a></li>
    <li><a href="https://bitl.bz/Q4gS3l" target="_blank" class="gmarket">G마켓</a></li>
    <li><a href="https://bitl.bz/EwlPLP" target="_blank" class="elevenst">11번가</a></li>
    <li><a href="https://bitl.bz/xwrg4w" target="_blank" class="ssg">SSG</a></li>
    <li><a href="https://bitl.bz/7KfCom" target="_blank" class="hfashion">H패션몰</a></li>
    <li><a href="https://bitl.bz/GLLEVg" target="_blank" class="cj">CJ더마켓</a></li>
    <li><a href="https://bitl.bz/3nLetk" target="_blank" class="school">교복몰</a></li>
    <li><a href="https://bitl.bz/uzfOYK" target="_blank" class="kyobo">교보문고</a></li>
  </ul>

  <script>
    // 화면(뷰포트) 밖으로 튤팁이 잘리지 않도록 위치를 보정하고,
    // 터치 기기(호버 미지원)에서도 탭으로 툴팁을 볼 수 있게 처리
    document.querySelectorAll('a').forEach(function (link) {
      const tooltip = link.querySelector('.tooltip');
      if (!tooltip) return;
      const li = link.closest('li');

      function clampToViewport() {
        // 기본 중앙 정렬 상태로 리셋 후 실제 위치 측정
        tooltip.style.left = '50%';
        tooltip.style.transform = 'translateX(-50%)';

        const rect = tooltip.getBoundingClientRect();
        const margin = 8; // 화면 가장자리 최소 여백
        let shift = 0;

        if (rect.left < margin) {
          shift = margin - rect.left;
        } else if (rect.right > window.innerWidth - margin) {
          shift = (window.innerWidth - margin) - rect.right;
        }

        if (shift !== 0) {
          tooltip.style.transform = `translateX(calc(-50% + ${shift}px))`;
        }
      }

      // 데스크톱 호버 시 위치 보정
      link.addEventListener('mouseenter', clampToViewport);

      // 모바일/터치: 탭하면 툴팁 토글, 실제 이동은 두 번째 탭에서
      link.addEventListener('click', function (e) {
        const isTouch = matchMedia('(hover: none)').matches;
        if (!isTouch) return; // 데스크톱은 기본 동작(바로 이동) 유지

        if (!tooltip.classList.contains('show')) {
          e.preventDefault(); // 첫 탭은 툴팁만 보여주기
          document.querySelectorAll('.tooltip.show').forEach(t => t.classList.remove('show'));
          document.querySelectorAll('li.active').forEach(x => x.classList.remove('active'));
          tooltip.classList.add('show');
          li.classList.add('active');
          clampToViewport();
        }
        // 이미 보이는 상태에서 다시 탭하면 링크 이동 허용
      });
    });

    // 다른 곳을 탭하면 열려있던 툴팁 닫기
    document.addEventListener('click', function (e) {
      if (!e.target.closest('a')) {
        document.querySelectorAll('.tooltip.show').forEach(t => t.classList.remove('show'));
        document.querySelectorAll('li.active').forEach(x => x.classList.remove('active'));
      }
    });
  </script>
</body>
</html>
