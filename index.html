<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑모음</title>

  <!-- 홈 화면 추가 / PWA 설정 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#FF5A00">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS 홈 화면 추가 시 브라우저 주소창 없이 앱처럼 열리도록 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="쇼핑모음">

  <style>
    * { box-sizing: border-box; }

    body { font-family: sans-serif; margin: 20px; }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h2 {
      margin: 0;
      font-size: 1.4rem;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    /* li 자체를 position 기준점 + 개별 stacking context 로 사용 */
    li {
      position: relative;
      z-index: 1;
    }
    /* 호버/탭 상태인 항목만 다른 항목들 위로 올라오도록 */
    li:hover,
    li.active {
      z-index: 50;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
    }
    a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    a img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #fff;
    }

    /* 브랜드별 색상 */
    .kurly { background: #6A1B9A; }
    .coupang { background: #FF5A00; }
    .gmarket { background: #008000; }
    .elevenst { background: #FF0000; }
    .ssg { background: #222; }
    .hyundai { background: #0066CC; }
    .gs { background: #00AEEF; }
    .aliexpress { background: #E52D27; }
    .hfashion { background: #333399; }
    .cj { background: #FF6600; }
    .kyobo { background: #2E8B57; }
    .school { background: #444; }
    .default { background: #222; }

    /* 툴팁 */
    .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;

      /* 핵심: 링크 박스보다 좁아서 세로로 길게 늘어지는 문제 방지 */
      width: max-content;
      max-width: min(240px, calc(100vw - 24px));

      font-size: 0.85rem;
      line-height: 1.4;
      white-space: normal;
      pointer-events: none;

      transition: opacity 0.2s ease;
      z-index: 100;
    }
    .tooltip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent #333 transparent;
    }

    /* 데스크톱: 마우스 호버로 표시 */
    a:hover .tooltip,
    a:focus-visible .tooltip {
      visibility: visible;
      opacity: 1;
    }
    /* 모바일: JS가 붙여주는 .show 클래스로 표시 (탭 지원) */
    .tooltip.show {
      visibility: visible;
      opacity: 1;
    }

    /* 설치 / 즐겨찾기 버튼 — 타이틀 우측의 작은 아이콘 버튼 2개 */
    .icon-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: #FF5A00;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 20; /* 아래 그리드 버튼(li, z-index:1)보다 위에 오도록 */
    }
    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.2);
      z-index: 60;
    }
    .icon-btn:active { opacity: 0.85; transform: translateY(0); }

    /* 홈 화면 추가 버튼은 살짝 톤을 다르게 구분 */
    #homeBtn { background: #222; }

    /* 데스크톱 호버 시 작은 라벨 툴팁 */
    .icon-btn::after {
      content: attr(data-label);
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #333;
      color: #fff;
      font-size: 0.75rem;
      white-space: nowrap;
      padding: 5px 9px;
      border-radius: 6px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 60;
    }
    .icon-btn:hover::after {
      opacity: 1;
      visibility: visible;
    }

    /* 안내 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      max-width: 280px;
      width: 100%;
      padding: 16px 16px;
      text-align: left;
    }
    .modal h3 {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }
    .modal p, .modal ol {
      font-size: 0.82rem;
      line-height: 1.5;
      color: #333;
      margin: 0 0 6px;
      padding-left: 16px;
      word-break: keep-all;
    }
    .modal button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* 개발자 블로그 링크 */
    .blog-link {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 14px 16px;
      background: #03C75A; /* 네이버 블로그 브랜드 컬러 */
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .blog-link:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }
    .blog-link .blog-icon {
      display: block;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
    }
    .blog-link .blog-text small {
      display: block;
      font-weight: 400;
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* 광고 영역 */
    .ad-section {
      margin-top: 16px;
    }
    .ad-label {
      font-size: 0.72rem;
      color: #999;
      margin-bottom: 6px;
      text-align: center;
    }
    .ad-wrap {
      width: 100%;
      overflow: hidden; /* 광고 iframe이 화면 폭을 넘지 않도록 */
    }
  </style>
</head>
<body>

      <button id="bookmarkBtn" class="icon-btn" type="button" data-label="즐겨찾기 추가" aria-label="즐겨찾기 추가">

  <script>
    // 화면(뷰포트) 밖으로 튤팁이 잘리지 않도록 위치를 보정하고,
    // 터치 기기(호버 미지원)에서도 탭으로 툴팁을 볼 수 있게 처리
    document.querySelectorAll('a').forEach(function (link) {
      const tooltip = link.querySelector('.tooltip');
      if (!tooltip) return;
      const li = link.closest('li');

      function clampToViewport() {
        // 기본 중앙 정렬 상태로 리셋 후 실제 위치 측정
        tooltip.style.left = '50%';
        tooltip.style.transform = 'translateX(-50%)';

        const rect = tooltip.getBoundingClientRect();
        const margin = 8; // 화면 가장자리 최소 여백
        let shift = 0;

        if (rect.left < margin) {
          shift = margin - rect.left;
        } else if (rect.right > window.innerWidth - margin) {
          shift = (window.innerWidth - margin) - rect.right;
        }

        if (shift !== 0) {
          tooltip.style.transform = `translateX(calc(-50% + ${shift}px))`;
        }
      }

      // 데스크톱 호버 시 위치 보정
      link.addEventListener('mouseenter', clampToViewport);

      // 모바일/터치: 탭하면 툴팁 토글, 실제 이동은 두 번째 탭에서
      link.addEventListener('click', function (e) {
        const isTouch = matchMedia('(hover: none)').matches;
        if (!isTouch) return; // 데스크톱은 기본 동작(바로 이동) 유지

        if (!tooltip.classList.contains('show')) {
          e.preventDefault(); // 첫 탭은 툴팁만 보여주기
          document.querySelectorAll('.tooltip.show').forEach(t => t.classList.remove('show'));
          document.querySelectorAll('li.active').forEach(x => x.classList.remove('active'));
          tooltip.classList.add('show');
          li.classList.add('active');
          clampToViewport();
        }
        // 이미 보이는 상태에서 다시 탭하면 링크 이동 허용
      });
    });

    // 다른 곳을 탭하면 열려있던 툴팁 닫기
    document.addEventListener('click', function (e) {
      if (!e.target.closest('a')) {
        document.querySelectorAll('.tooltip.show').forEach(t => t.classList.remove('show'));
        document.querySelectorAll('li.active').forEach(x => x.classList.remove('active'));
      }
    });
  </script>

  <script>
    // ── 즐겨찾기 추가 / 홈 화면 추가 버튼 (기능 분리) ──────────────────
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const homeBtn = document.getElementById('homeBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalContent = document.getElementById('modalContent');

    let deferredPrompt = null; // Android/Chrome 계열의 네이티브 "홈 화면에 추가" 프롬프트

    // Android Chrome 등에서 "설치 가능" 이벤트가 오면 저장해뒀다가 버튼 클릭 시 사용
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function detectPlatform() {
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /Android/.test(ua);
      const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      return { isIOS, isAndroid, isSafari, isStandalone };
    }

    function openModal(html) {
      modalContent.innerHTML = html + '<button id="modalCloseBtn" type="button">닫기</button>';
      modalBackdrop.classList.add('open');
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    }
    function closeModal() {
      modalBackdrop.classList.remove('open');
    }
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    // ── ① 즐겨찾기 추가: 브라우저에 "북마크"로 저장 (홈 화면 아이콘 아님) ──
    bookmarkBtn.addEventListener('click', () => {
      const { isIOS, isAndroid, isSafari } = detectPlatform();

      if (isIOS && isSafari) {
        openModal(`
          <h3>즐겨찾기에 추가</h3>
          <p>공유 버튼 ⬆️ → <b>"즐겨찾기에 추가"</b></p>
        `);
        return;
      }

      if (isAndroid) {
        openModal(`
          <h3>즐겨찾기에 추가</h3>
          <p>주소창 <b>☆</b> 아이콘 또는 메뉴(⋮) → <b>"즐겨찾기 추가"</b></p>
        `);
        return;
      }

      // 데스크톱: 브라우저 정책상 JS로 바로 추가할 수 없어 단축키 안내
      const isMac = navigator.platform.toUpperCase().includes('MAC');
      const shortcut = isMac ? 'Cmd + D' : 'Ctrl + D';
      openModal(`
        <h3>즐겨찾기에 추가</h3>
        <p><b>${shortcut}</b> 를 누르면 바로 추가됩니다.</p>
      `);
    });

    // ── ② 홈 화면에 추가: 앱처럼 아이콘 설치 (PWA) ──────────────────
    homeBtn.addEventListener('click', async () => {
      const { isIOS, isAndroid, isSafari, isStandalone } = detectPlatform();

      if (isStandalone) {
        openModal('<h3>이미 추가됨</h3><p>이미 홈 화면 앱으로 실행 중이에요.</p>');
        return;
      }

      // 1) Android/Chrome, Edge 등: 네이티브 "홈 화면에 추가" 프롬프트 지원
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome !== 'accepted') {
          openModal(`
            <h3>홈 화면에 추가</h3>
            <p>메뉴(⋮) → <b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b></p>
          `);
        }
        return;
      }

      // 2) iOS Safari: beforeinstallprompt 미지원 → 수동 안내
      if (isIOS && isSafari) {
        openModal(`
          <h3>홈 화면에 추가</h3>
          <p>공유 버튼 ⬆️ → <b>"홈 화면에 추가"</b> → 추가</p>
        `);
        return;
      }

      // 3) Android지만 beforeinstallprompt가 아직 안 뜬 경우
      if (isAndroid) {
        openModal(`
          <h3>홈 화면에 추가</h3>
          <p>메뉴(⋮) → <b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b></p>
        `);
        return;
      }

      // 4) 데스크톱 브라우저: 앱 설치 아이콘 안내 (즐겨찾기와는 별도 기능)
      openModal(`
        <h3>홈 화면에 추가</h3>
        <p>주소창의 <b>설치 아이콘(⊕)</b>을 눌러주세요.</p>
      `);
    });
  </script>
</body>
</html>
