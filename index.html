<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑모음</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }

    /* 그리드 레이아웃 */
    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    /* 버튼 스타일 */
    a {
      display: block;
      padding: 15px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.3s, transform 0.2s;
      position: relative;   /* 툴팁 기준 */
      overflow: visible;    /* 툴팁 잘리지 않도록 */
    }
    a:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }

    /* 툴팁 (아래쪽 표시 + 화면 제한) */
    a .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      top: 110%; /* 버튼 아래쪽 */
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: normal; /* 줄바꿈 허용 */
      max-width: 90vw;     /* 화면 너비 제한 */
      font-size: 0.9rem;
      transition: opacity 0.3s;
      z-index: 999;        /* 버튼 위로 표시 */
    }
    a .tooltip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent #333 transparent;
    }
    a:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    /* 컬리 버튼 전용 스타일 */
    a.kurly {
      background: #6A1B9A; /* 보라색 배경 (컬리 느낌) */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px; /* 글자와 이미지 간격 */
    }    
    a.kurly img {
      width: 24px;  /* 아이콘 크기 */
      height: 24px;
      border-radius: 4px; /* 모서리 둥글게 */
    }    
  </style>
</head>
