<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑모음</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }

    /* 그리드 레이아웃 */
    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    /* 기본 버튼 스타일 */
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
      overflow: visible;
    }
    a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* 툴팁 */
    a .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      top: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: normal;
      max-width: 90vw;
      font-size: 0.9rem;
      transition: opacity 0.3s;
      z-index: 999;
    }
    a .tooltip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent #333 transparent;
    }
    a:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    /* 브랜드별 색상 */
    .kurly { background: #6A1B9A; }       /* 컬리 보라색 */
    .coupang { background: #FF5A00; }     /* 쿠팡 주황색 */
    .gmarket { background: #008000; }     /* G마켓 초록색 */
    .elevenst { background: #FF0000; }    /* 11번가 빨강 */
    .ssg { background: #222; }            /* SSG 검정 */
    .hyundai { background: #0066CC; }     /* 현대홈쇼핑 파랑 */
    .gs { background: #00AEEF; }          /* GS홈쇼핑 하늘색 */
    .aliexpress { background: #E52D27; }  /* 알리익스프레스 빨강 */
    .hfashion { background: #333399; }    /* H패션몰 남색 */
    .cj { background: #FF6600; }          /* CJ더마켓 주황 */
    .kyobo { background: #2E8B57; }       /* 교보문고 초록 */
    .school { background: #444; }         /* 교복몰 회색 */

    /* 아이콘 크기 */
    a img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
  </style>
</head>
