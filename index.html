<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑모음</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }

    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
      overflow: visible;
    }
    a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    a img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #fff;
    }

    /* 브랜드별 색상 */
    .kurly { background: #6A1B9A; }
    .coupang { background: #FF5A00; }
    .gmarket { background: #008000; }
    .elevenst { background: #FF0000; }
    .ssg { background: #222; }
    .hyundai { background: #0066CC; }
    .gs { background: #00AEEF; }
    .aliexpress { background: #E52D27; }
    .hfashion { background: #333399; }
    .cj { background: #FF6600; }
    .kyobo { background: #2E8B57; }
    .school { background: #444; }
    .default { background: #222; }

    /* 툴팁 */
    a .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      top: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: normal;
      max-width: 90vw;
      font-size: 0.9rem;
      transition: opacity 0.3s;
      z-index: 999;
    }
    a .tooltip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent #333 transparent;
    }
    a:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <h2>내 쇼핑 사이트</h2>
  <ul>
    <li><a href="http://deg.kr/shopbox/a7db91" target="_blank" class="default">오늘의 추천상품</a></li>
    <li><a href="https://bitl.bz/S0YWE2" target="_blank" class="kurly">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/MarketKurly_logo.png" alt="컬리"> 컬리
    </a></li>
    <li><a href="https://bitl.bz/P1aoKl" target="_blank" class="hyundai">현대홈쇼핑</a></li>
    <li><a href="https://bitl.bz/kznqBE" target="_blank" class="gs">GS홈쇼핑</a></li>
    <li><a href="https://bitl.bz/3laSX4" target="_blank" class="aliexpress">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/AliExpress_logo.svg" alt="알리익스프레스"> 알리익스프레스
    </a></li>
    <li><a href="https://bitl.bz/VnIypD" target="_blank" class="coupang">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Coupang_logo.svg" alt="쿠팡"> 쿠팡
      <span class="tooltip">링크를 통해 구매 시 수수료를 제공받습니다</span>
    </a></li>
    <li><a href="https://bitl.bz/Q4gS3l" target="_blank" class="gmarket">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Gmarket_logo.svg" alt="G마켓"> G마켓
    </a></li>
    <li><a href="https://bitl.bz/EwlPLP" target="_blank" class="elevenst">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/11st_logo.svg" alt="11번가"> 11번가
    </a></li>
    <li><a href="https://bitl.bz/xwrg4w" target="_blank" class="ssg">SSG</a></li>
    <li><a href="https://bitl.bz/7KfCom" target="_blank" class="hfashion">H패션몰</a></li>
    <li><a href="https://bitl.bz/GLLEVg" target="_blank" class="cj">CJ더마켓</a></li>
    <li><a href="https://bitl.bz/3nLetk" target="_blank" class="school">교복몰</a></li>
    <li><a href="https://bitl.bz/uzfOYK" target="_blank" class="kyobo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/7d/Kyobo_Book_Centre_logo.png" alt="교보문고"> 교보문고
    </a></li>
  </ul>
</body>
</html>
