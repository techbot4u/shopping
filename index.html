<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑모음</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }

    /* 그리드 레이아웃 */
    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    /* 버튼 스타일 */
    a {
      display: block;
      padding: 15px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.3s, transform 0.2s;
    }
    a:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }

    /* 툴팁 */
    a .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      font-size: 0.9rem;
      transition: opacity 0.3s;
    }
    a:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <h2>내 쇼핑 사이트</h2>

    <li><a href="https://bitl.bz/3laSX4" target="_blank">알리익스프레스</a></li>
    <li><a href="https://bitl.bz/VnIypD" target="_blank">쿠팡<span class="tooltip">링크를 통해 구매 시 수수료를 제공받습니다</span></a></li>
    <li><a href="https://bitl.bz/Q4gS3l" target="_blank">G마켓</a></li>

  </ul>
